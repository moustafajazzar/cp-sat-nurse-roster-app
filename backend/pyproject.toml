[project]
name = "nurse-roster-backend"
version = "0.1.0"
description = "The Django application: JSON API, SPA server and queue worker"
requires-python = ">=3.14,<3.15"
dependencies = [
    "cryptography>=50.0.2,<51",
    "django>=6.1.3,<6.2",
    "django-ninja>=1.7.3,<1.8",
    "gunicorn>=26.2,<27",
    "hijridate>=2.6.0,<3",  # To name a Ramadan by its Hijri year; its days come from the solver's calendar module.
    "httpx>=0.28,<0.29",
    "nurse-roster",
    "procrastinate[django]>=3.10,<3.11",
    "psycopg[binary,pool]>=3.3.6,<3.4",
    "pydantic<3",
    "pywebpush>=2.5,<2.6",
    "whitenoise>=6.12,<7",
    "xlsxwriter>=3.3.1,<3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
nurse-roster = { workspace = true }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
