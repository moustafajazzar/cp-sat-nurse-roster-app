# The whole installation. Every service is given only the
# variables it needs: the solver holds no secret but its token and no database credential.
name: nurse-roster

# Docker keeps a container's output for good unless told otherwise. The worker's can name a nurse and a date, so it is
# personal data: kept to five files of 10 MB a container, the oldest dropped.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-app: &app
  image: ${APP_IMAGE:-nurse-roster-app}:${APP_VERSION:-dev}
  build:
    context: ..
  restart: unless-stopped
  logging: *logging

x-django-env: &django-env
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env, see .env.example}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
  SOLVER_TOKEN: ${SOLVER_TOKEN:?set SOLVER_TOKEN in .env, see .env.example}
  DOMAIN: ${DOMAIN:-}
  TIME_ZONE: ${TIME_ZONE:-Asia/Riyadh}

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    depends_on:
      web:
        condition: service_healthy
    environment:
      CADDY_SITE: ${DOMAIN:-https://}
      CADDY_TLS_SNIPPET: self-signed${DOMAIN:+-off}
      # The hospital's own proxies in front of Caddy (deploy/Caddyfile), for Caddy alone: web reads what Caddy worked out.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [public, frontend]

  web:
    <<: *app
    # Three workers of four threads: a slow request, a login's hash or a nurse import's confirmation holds one
    # thread of twelve, not one worker of three. Under gthread, gunicorn's timeout (left at its default) is only how long a
    # worker's main loop may go silent, so no request is killed for its length: confirming 500 nurses takes as long as its
    # hashes do (nurses/importing.py). Each thread holds at most one database connection, so web at most 12. A
    # connection stays open 10 s after an answer (--keep-alive); Caddy forgets an idle one to web after 2 s (Caddyfile), so it
    # never sends a request down one gunicorn has just closed. `prepare` migrates and seeds; config/gunicorn.py makes
    # gunicorn's lines and one a request JSON on standard output.
    command: >-
      sh -c "python manage.py prepare
      && unset INITIAL_ADMIN_PASSWORD
      && exec gunicorn config.wsgi -c config/gunicorn.py --bind 0.0.0.0:8000
      --worker-class gthread --workers 3 --threads 4 --keep-alive 10"
    environment:
      <<: *django-env
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?set INITIAL_ADMIN_PASSWORD in .env, see .env.example}
    depends_on:
      db:
        condition: service_healthy
      solver:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=8)"
      interval: 10s
      timeout: 10s
      retries: 5
      # Migrations run first; a large one on an upgrade must not count as a failure.
      start_period: 5m
      start_interval: 2s
    # It lists the backups and hands one to the System Admin; the worker writes them.
    volumes:
      - backups:/backups:ro
    # `frontend` is also where a Prometheus scrapes `web:8000/metrics`; Caddy refuses the path.
    networks: [frontend, backend, solver]

  worker:
    <<: *app
    # Four at once, so a scheduled job never waits behind a running solve: every job takes a lock. `queue` is
    # Procrastinate's own command, with what it prints logged as JSON (ops/management/commands/queue.py).
    command: python manage.py queue worker --concurrency 4
    environment: *django-env
    depends_on:
      # `web` has run the migrations once it is healthy, the queue's tables among them.
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, manage.py, queue, healthchecks]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
      start_interval: 5s
    volumes:
      - backups:/backups
    # `egress` is its way out, to the browsers' push services alone: nothing else of ours reaches the internet. The
    # hosts it may post to are listed in backend/notifications/subscriptions.py.
    networks: [backend, solver, egress]

  solver:
    <<: *app
    working_dir: /app/solver
    command: uvicorn --factory solver_service.app:create_app --host 0.0.0.0 --port 8080 --log-config solver_service/logging.json
    environment:
      SOLVER_TOKEN: ${SOLVER_TOKEN:?set SOLVER_TOKEN in .env, see .env.example}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request as u
          u.urlopen(u.Request("http://127.0.0.1:8080/health", headers={"Authorization": "Bearer " + os.environ["SOLVER_TOKEN"]}), timeout=4)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 1s
    networks: [solver]

  db:
    image: postgres:18
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: nurse_roster
      POSTGRES_USER: nurse_roster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      TZ: ${TIME_ZONE:-Asia/Riyadh}
    healthcheck:
      test: [CMD, pg_isready, -U, nurse_roster, -d, nurse_roster]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 1s
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backend]

networks:
  public: {}
  # Not internal: the worker's alone, for pushes. `web`, the database and the solver are on none that is not.
  egress: {}
  frontend:
    internal: true
  backend:
    internal: true
  solver:
    internal: true

volumes:
  pgdata: {}
  # The nightly backups (ops/backups.py), mounted by the worker and, read-only, by web: no other service sees them, and only
  # the System Admin downloads one. Off-site copies are the hospital's.
  backups: {}
  caddy_data: {}
