[project]
name = "nurse-roster"
version = "0.1.0"
description = "The vendored CP-SAT nurse rostering package and the HTTP service around it"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162,<0.163",
    "hijridate>=2.6.0,<3",
    "ortools>=9.15.6755,<9.16",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nurse_roster", "solver_service"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "service_tests"]
